<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
<title id="title">Mahmoud Salama monogram</title><desc id="desc">MS monogram surrounded by two orbital rings.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10203c"/><stop offset="1" stop-color="#071226"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19d7ff"/><stop offset="1" stop-color="#d8b86a"/></linearGradient></defs>
<rect x="1" y="1" width="62" height="62" rx="19" fill="url(#bg)" stroke="#d8b86a" stroke-opacity=".55"/>
<ellipse cx="32" cy="32" rx="20" ry="12" fill="none" stroke="url(#ring)" stroke-width="1.5" transform="rotate(-24 32 32)" opacity=".85"/>
<ellipse cx="32" cy="32" rx="17" ry="24" fill="none" stroke="#19d7ff" stroke-width="1.2" transform="rotate(28 32 32)" opacity=".52"/>
<text x="32" y="36.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#f5e8be">&lt;MS&gt;</text>
</svg>