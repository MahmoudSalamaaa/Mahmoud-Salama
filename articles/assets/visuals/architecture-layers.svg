</defs><rect width="1400" height="820" rx="40" fill="url(#bg)"/><text x="80" y="92" fill="#8eefff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">ENTERPRISE ARCHITECTURE</text><text x="80" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Connect strategy to execution</text>
