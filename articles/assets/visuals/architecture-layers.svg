<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Enterprise architecture layers</title><desc id="d">A layered architecture linking strategy to technology execution.</desc>
