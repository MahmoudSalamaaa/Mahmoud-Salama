<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">From technology delivery to institutional capability</title><desc id="d">A visual model showing seven connected capability areas.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050b18"/>
    <stop offset="0.58" stop-color="#071f39"/>
    <stop offset="1" stop-color="#0b1730"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#19d7ff"/>
    <stop offset="1" stop-color="#d8b86a"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#19d7ff"/>
  </marker>
</defs>
<rect width="1400" height="760" rx="40" fill="url(#bg)"/>
<circle cx="1180" cy="100" r="190" fill="none" stroke="#d8b86a" opacity=".13" stroke-width="2"/><circle cx="1180" cy="100" r="130" fill="none" stroke="#19d7ff" opacity=".13" stroke-width="2"/>
<text x="80" y="92" fill="#8eefff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">TRANSFORMATION MODEL</text>
<text x="80" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Technology is one part of capability</text>
<g><rect x="90" y="245" width="390" height="126" rx="26" fill="#fff"/><text x="285" y="300" text-anchor="middle" fill="#071226" font-family="Arial,sans-serif" font-size="28" font-weight="700">Digital Project</text><text x="285" y="338" text-anchor="middle" fill="#617187" font-family="Arial,sans-serif" font-size="19">System, release, feature</text></g>
<path d="M505 308 H835" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
<g><rect x="875" y="230" width="435" height="156" rx="30" fill="url(#accent)"/><text x="1092" y="298" text-anchor="middle" fill="#04101f" font-family="Arial,sans-serif" font-size="31" font-weight="800">Institutional Capability</text><text x="1092" y="340" text-anchor="middle" fill="#092139" font-family="Arial,sans-serif" font-size="19">Reliable performance that endures</text></g>
<g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">
  <g><circle cx="150" cy="560" r="70" fill="#102c47" stroke="#19d7ff" stroke-width="3"/><text x="150" y="567" fill="#fff">Outcomes</text></g>
