</defs><rect width="1400" height="760" rx="40" fill="url(#bg)"/><text x="80" y="92" fill="#8eefff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">EVIDENCE BASELINE</text><text x="80" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Separate symptoms from root causes</text>
<g><circle cx="700" cy="430" r="145" fill="url(#accent)"/><text x="700" y="415" text-anchor="middle" fill="#04101f" font-family="Arial,sans-serif" font-size="30" font-weight="800">Root Cause</text><text x="700" y="455" text-anchor="middle" fill="#092139" font-family="Arial,sans-serif" font-size="24" font-weight="700">Baseline</text></g>
<g font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
  <g><rect x="100" y="260" width="240" height="86" rx="20" fill="#fff"/><text x="220" y="313" fill="#071226">Process Observation</text></g>
  <g><rect x="1060" y="260" width="240" height="86" rx="20" fill="#fff"/><text x="1180" y="313" fill="#071226">Stakeholder Interviews</text></g>
