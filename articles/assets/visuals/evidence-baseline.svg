<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Evidence baseline and root cause analysis</title><desc id="d">Evidence sources surrounding a central root cause baseline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050b18"/>
    <stop offset="0.58" stop-color="#071f39"/>
    <stop offset="1" stop-color="#0b1730"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
