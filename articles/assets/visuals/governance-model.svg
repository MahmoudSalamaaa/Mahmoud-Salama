<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">Governance embedded in the operating model</title><desc id="d">A governance model connecting decision rights, accountability, controls and escalation.</desc>
