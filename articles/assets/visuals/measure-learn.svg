<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">Continuous improvement cycle</title><desc id="d">A cycle of observing, deciding, acting and improving.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050b18"/>
    <stop offset="0.58" stop-color="#071f39"/>
    <stop offset="1" stop-color="#0b1730"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#19d7ff"/>
    <stop offset="1" stop-color="#d8b86a"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#19d7ff"/>
  </marker>
</defs><rect width="1400" height="720" rx="40" fill="url(#bg)"/><text x="80" y="92" fill="#8eefff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">MEASURE + LEARN</text><text x="80" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Turn operational data into better decisions</text>
<g font-family="Arial,sans-serif" font-size="27" font-weight="800" text-anchor="middle">
  <g><circle cx="700" cy="395" r="122" fill="url(#accent)"/><text x="700" y="386" fill="#04101f">Continuous</text><text x="700" y="429" fill="#092139">Improvement</text></g>
  <g><rect x="560" y="205" width="280" height="92" rx="26" fill="#fff"/><text x="700" y="262" fill="#071226">Observe</text></g>
  <g><rect x="975" y="348" width="280" height="92" rx="26" fill="#eafaff"/><text x="1115" y="405" fill="#071226">Decide</text></g>
  <g><rect x="560" y="545" width="280" height="92" rx="26" fill="#fff8e8"/><text x="700" y="602" fill="#071226">Act</text></g>
  <g><rect x="145" y="348" width="280" height="92" rx="26" fill="#eafaff"/><text x="285" y="405" fill="#071226">Improve</text></g>
</g>
<g stroke="#19d7ff" stroke-width="7" fill="none" marker-end="url(#arrow)"><path d="M830 250 C980 270 1040 310 1060 345"/><path d="M1115 440 C1080 540 940 590 845 590"/><path d="M560 590 C430 570 345 510 315 442"/><path d="M285 348 C320 260 455 220 560 235"/></g>
</svg>