<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="t d"><title id="t">Outcome-first design chain</title><desc id="d">A chain from measurable outcome to technology capability.</desc>
