<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EY | Director Interview Focus · Updated</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253b;font-family:Arial,sans-serif}header{background:#17253b;color:white;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}small{color:#d8e1ef}main{max-width:1250px;margin:auto;padding:14px}.top{font-size:12px;color:#64748b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.q{background:white;border:1px solid #dce3ec;border-left:4px solid #f4c400;border-radius:10px;min-height:80px;padding:12px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.35;color:#17253b}.q:hover{background:#fff9dc}.n{color:#8995a8;font-size:11px;margin-right:8px}.overlay{position:fixed;inset:0;background:#101d31b8;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modal h2{font-size:22px}.keys{display:inline-block;background:#fff3bc;border-radius:8px;padding:9px;font-weight:bold}.answer{font-size:17px;line-height:1.6}.arabic{direction:rtl;text-align:right;background:#f2f6fc;padding:15px;border-radius:10px;line-height:1.8}.actions{display:flex;justify-content:space-between;margin-top:18px}button.action{background:#17253b;color:white;border:0;border-radius:8px;padding:10px 15px}.q:focus-visible,.close:focus-visible,.action:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;font-size:22px;padding:4px 12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.q{font-size:12px;min-height:86px;padding:10px}header h1{font-size:16px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div><h1>EY · Enterprise Architecture</h1><small>Director Technical Interview | Focus Study</small></div><small>11 Nov · 3 PM Cairo</small></header><main><div class="top">39 evidence-backed questions · Priority order · EN + AR + Keywords</div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" onclick="closeQ()">×</button><small id="count"></small><h2 id="question"></h2><div class="keys" id="keys"></div><p class="answer" id="answer"></p><div class="arabic" id="arabic"></div><div class="actions"><button class="action" onclick="openQ(current-1)">← Previous</button><button class="action" onclick="openQ(current+1)">Next →</button></div></div></div><script>const data=[["Tell me about yourself and your architecture experience","Strategy · Architecture · Delivery","I have over 18 years of experience, from hands-on software engineering to enterprise technology leadership. Today I head Information Systems and Digital Transformation at UPA, leading 54 professionals through nine direct reports and overseeing an annual technology budget of around EGP 150 million. I have led architecture decisions for MedIQ, a national healthcare platform, including integration, data and reporting architecture. Earlier in Oman, I led 20 developers on government and enterprise systems, including an education portal serving around one million users. I bring practical architecture ownership, delivery experience and public-sector understanding.","ابدأ Career Journey ثم UPA 54/9 و150M، ثم MedIQ، ثم Oman. لا تطل أكثر من 75 ثانية."],["Walk me through MedIQ architecture and your contribution","Business · Integration · Outcomes","MedIQ is a national healthcare procurement and supply-chain platform serving over 38,000 users. I owned major architecture and technology decisions, while my engineering teams implemented them. I selected React with KendoReact, Node.js, PostgreSQL, Redis and Telerik Reporting. We used a layered architecture with a central transaction database and separated workloads where needed. For example, I decided to move very large supplier reports onto dedicated servers because reports exceeding 2,000 pages were affecting smaller reports. This improved workload isolation. The wider transformation reduced order cycle time by 80% and delivery cycle time by 60%.","أهم قصة شخصية: اخترت Stack، وحددت فصل التقارير الثقيلة. وضح PostgreSQL transaction core، Redis cache، Docker، Superset. النتائج تخص التحول ككل، لا تنسب كل رقم لقرار واحد."],["How would you establish Enterprise Architecture for a government client?","Assess · Target · Roadmap","I start with business goals and stakeholders. I assess the current state, map business capabilities, define the target architecture, identify gaps, and build a phased roadmap with governance.","حدد Business Objectives ثم As-Is وCapability Map وGap Analysis وTarget State وTransition Roadmap. اربط كل مرحلة بمخرجات واضحة."],["Explain TOGAF ADM and how you apply it","Vision · Domains · Governance","TOGAF ADM is an iterative method. It starts with architecture vision, covers business, data, application and technology domains, then plans migration. Implementation Governance checks alignment during delivery, while Change Management keeps the architecture relevant. I use these principles in practice, without claiming TOGAF certification.","احفظ التسلسل: Preliminary, A Vision, B Business, C Information Systems, D Technology, E Opportunities & Solutions, F Migration Planning, G Implementation Governance, H Change Management. Requirements Management مستمر. لا تدّعِ امتلاك شهادة TOGAF."],["What architecture artifacts would you deliver?","Capabilities · Diagrams · Roadmap","I deliver a capability map, current and target architecture views, application and integration inventories, data flows, gap analysis, standards, architecture decisions, and a prioritized roadmap.","Business Capability Map، Application Portfolio، Integration Landscape، Data Flow، Target Architecture، Gap Matrix، ADRs، Roadmap. اذكر الهدف من كل Artifact."],["How do you translate strategy into architecture?","Goals · Capabilities · Design","At UPA, the business objective was to improve national healthcare procurement and supply-chain processes. We translated that into digital workflows, enterprise integration, reporting and governed data capabilities. I linked architecture choices to operational results, including an 80% reduction in order cycle time across the transformation.","اربط Business Objective ثم Capabilities ثم Architecture Decisions ثم Outcomes."],["How do you establish an Architecture Review Board?","Principles · Reviews · Exceptions","I define architecture principles, decision rights, design reviews, exception handling and evidence-based approval gates. In my current leadership role, I use architecture governance alongside QA, UAT and change governance. I distinguish architecture approval from CAB decisions about production change readiness.","لديك CAB عملي وQA/UAT Gates. لا تدّعِ مجلس ARB رسمي قائم إلا إذا كان مثبتًا."],["What do you know about NORA and Saudi DGA?","Reference · Alignment · Compliance","NORA provides reference guidance for Saudi government enterprise architecture. I would first confirm the current DGA requirements and the client's regulatory scope, then assess the baseline, document gaps and align the target architecture and roadmap. I have not claimed direct NORA implementation experience.","NORA مرجع حكومي سعودي وDGA جهة الحوكمة الرقمية. لا تزعم تنفيذ NORA عملياً؛ اشرح كيف تجري Compliance Assessment وتتحقق من أحدث الإصدارات الرسمية."],["How would you integrate SAP with government systems?","Contracts · Security · Reliability","At UPA, I led our side of a two-way integration with the SAP Strategic Medical Warehouses platform. We aligned business requirements, mapped data, defined interface contracts, tested scenarios and reconciled records before go-live. I was accountable for the UPA integration work; I did not configure SAP itself. This experience taught me to prioritise data ownership, traceability and end-to-end business validation.","استخدم SAP Strategic Medical Warehouses تحديدًا. لا تدعِ أنك SAP configurator. اذكر Reconciliation وBusiness Acceptance."],["How do you establish Data Governance and MDM?","Owners · Quality · Master Data","I led UPA-side data readiness and governance for a Central Data Warehouse that is operating in production. Our internal team handled significant data cleaning, mapping, preparation and harmonisation, alongside a delivery vendor. I focus on identifying authoritative sources, agreeing data ownership, validating quality and reconciling information before executives use it.","افصل بين Central DWH production وبين MedIQ Data Pipeline. العمل كان Hybrid مع Vendor. لا تدعِ تطبيق MDM مؤسسي كامل دون دليل."],["How do you handle disagreement with a senior stakeholder?","Listen · Trade-offs · Decide","I first understand the business concern, then compare options using risk, cost, continuity and measurable impact. During critical platform changes, I work with business owners and engineering leads to agree testing, reconciliation and cutover readiness. I document decisions and escalate unresolved risks through governance.","لا تختلق خلافًا بعينه؛ استخدم منهجك الحقيقي في Cutover Governance."],["A CIO needs a target architecture in six weeks. What do you do?","Scope · Workshops · Roadmap","I agree on scope and deliverables, run stakeholder workshops, assess the current state, develop target options, and deliver a practical roadmap with risks and assumptions.","Consulting Engagement: Kickoff، Interviews، Evidence Collection، Baseline، Options، Target State، Executive Readout."],["Why EY and why Technology Consulting?","Clients · Impact · Growth","I want to use my enterprise transformation experience across different clients. EY offers an opportunity to combine architecture, advisory, and measurable business outcomes.","الانتقال من قيادة Transformation داخل جهة واحدة إلى Advisory لعملاء MENA. لا تركز على الراتب أو ترك الوظيفة الحالية."],["How do you make an Architecture Decision Record?","Context · Options · Decision","I document the problem, constraints, options, trade-offs, selected decision and consequences. I assign an owner and review the decision when assumptions change.","ADR يوثق لماذا اخترنا الحل، وليس ماذا اخترنا فقط. مثال: API sync مقابل async messaging."],["How do you model architecture with ArchiMate?","Business · Application · Technology","ArchiMate is a modelling language for showing relationships between business, application and technology layers. I understand its purpose and would use the right views for each stakeholder. I would not claim hands-on ArchiMate expertise without evidence.","Business Layer وApplication Layer وTechnology Layer، مع Motivation وImplementation & Migration. إذا لم تستخدم الأداة مباشرة، قل إنك تفهم المنهج وتستخدم رسومات Architecture مكافئة."],["How do you apply Security by Design and Zero Trust?","Identity · Least Privilege · Verify","I start with data classification and threat assessment. I apply least privilege, strong identity controls, segmentation, encryption and monitoring. Zero Trust means verifying access continuously rather than trusting network location.","فرق بين مبدأ Zero Trust وتطبيقه الكامل. تحدث عن RBAC وAudit وThreat Modelling."],["Microservices or modular monolith?","Domain · Scale · Complexity","I choose based on business domains, team structure, scaling needs, and operational complexity. I do not use microservices by default. A modular monolith may be safer and simpler.","ناقش Bounded Contexts وDeployment Independence وDistributed Transactions وObservability وOperational Cost."],["How do you modernize a legacy system?","Assess · Strangler · Migrate","In critical public-sector platforms, I prefer controlled migration based on dependencies and data integrity. During MedIQ core replacement, I led governance around mapping, reconciliation, testing, parallel operation and cutover planning. The key trade-off was delivery speed versus continuity of service.","MedIQ core replacement هو المثال. لا تدّعِ استخدام Strangler Pattern حرفيًا ما لم يكن مثبتًا."],["How do you choose cloud, hybrid, or on-premises?","Workload · Security · Cost","At UPA, I have worked with private-cloud infrastructure, Docker-based services, load balancing and capacity planning. I assess workload sensitivity, regulation, integration, availability, operational skills and total cost before recommending cloud, hybrid or on-premises. I would not assume public cloud is always the best option.","خبرتك Private Cloud وFinOps-aligned optimisation؛ لا تدّعِ Public Cloud FinOps واسع."],["How do you design for high availability and DR?","SLA · RTO/RPO · Test","I start with business impact and recovery requirements, then review redundancy, backups, dependencies and recovery testing. At UPA, we completed a planned MedIQ recovery exercise in an alternate environment. I distinguish a tested exercise from a guaranteed recovery target and would validate RTO and RPO with measured evidence.","تمرين Recovery فعلي، لكن لا تحول الأهداف المقترحة إلى SLA محقق."],["What if a client cannot provide reliable architecture data?","Assumptions · Evidence · Validate","I record assumptions, interview system owners, inspect available evidence and classify findings by confidence. I validate high-risk gaps before recommending irreversible changes.","Consulting: Evidence Register، Assumption Log، Confidence Level، Validation Plan. لا تخترع As-Is."],["How do you resolve architecture versus delivery pressure?","Risk · Options · Decision","I explain the delivery impact of each option, agree on minimum controls, document any exception with an owner and expiry date, and plan remediation. Critical security risks cannot be ignored.","قدم حلًا متوازنًا بين Deadline وTechnical Debt وCompliance."],["How would you assess architecture maturity?","People · Process · Technology","I assess governance, architecture artefacts, standards, decision processes, application landscape and delivery compliance. I score gaps against an agreed maturity model and propose practical next steps.","مهم في EY Consulting: Maturity Assessment، Baseline، Target Level، Roadmap."],["What would you deliver in your first 90 days?","Understand · Assess · Deliver","I would learn EY's delivery standards and client priorities, support architecture assessments, build stakeholder trust, and deliver actionable recommendations and roadmaps.","30 يوم فهم Context، 60 يوم Assessment، 90 يوم Deliverables. ركز على Client Value."],["How do you perform application portfolio rationalisation?","Inventory · Value · Retire","I would classify applications by business capability, value, operating cost, integration dependencies and technical risk. My experience covers broad UPA digital portfolios, including procurement, inventory, pharmacy, assets and reporting. I would recommend retaining, investing, migrating or retiring systems only after validating their business owners and dependencies.","استشهد بتعدد عائلات MedIQ: Procurement, Inventory, Pharmacy, Assets, Analytics. TIME منهج تقييم مقترح وليس مشروعًا مثبتًا."],["How do you define architecture principles?","Business · Standards · Exceptions","I agree on principles with stakeholders, such as security by design, reuse and interoperability. I define how each principle is measured and how exceptions are approved.","لا تكتفِ بقائمة مبادئ؛ حدد rationale وimplications وgovernance."],["How do you manage technical debt?","Identify · Prioritise · Reduce","I maintain a technical debt register, assess business impact and operational risk, and include remediation in the delivery roadmap.","وضح كيف توازن بين سرعة التسليم والموثوقية وتكاليف الصيانة."],["What is the difference between EA and Solution Architecture?","Enterprise · Solution · Alignment","Enterprise Architecture defines enterprise-wide direction and standards. Solution Architecture designs a specific solution within those guardrails. Both must align to business outcomes.","EA يهتم بالقدرات والأنظمة والبيانات على مستوى المؤسسة؛ Solution Architecture بتصميم حل محدد."],["How do you handle architecture exceptions?","Record · Risk · Approve","I document the deviation, business justification, risks, compensating controls, owner and expiry date. The appropriate governance body approves or rejects it.","Exception Register مع تاريخ مراجعة وخطة معالجة؛ ليس استثناءً مفتوحًا للأبد."],["How do you make a business case for modernisation?","Benefits · TCO · Risk","I compare the current and proposed options using investment cost, operating cost, business benefits, implementation risk and measurable outcomes.","اذكر TCO وROI وNPV عند توفر البيانات، ولا تخترع أرقامًا."],["How do you design an API governance model?","Standards · Security · Lifecycle","I have personally designed healthcare REST APIs using JSON, HTTPS and token-based access, and I have also led larger integration teams. I start with the business process and data owner, then define contracts, validation, error handling, security, logging and testing. At enterprise scale, I add versioning and governance across systems.","ميز Hands-on REST APIs عن قيادة SAP Integration. لا تدّعِ Kafka production أو ESB غير مثبت."],["What is the difference between ARB and CAB?","Design · Change · Control","The Architecture Review Board evaluates design alignment and architecture exceptions. The Change Advisory Board assesses operational change risk and deployment readiness.","ARB يحكم التصميم، CAB يحكم التغيير التشغيلي؛ توجد نقاط تكامل بينهما."],["How do you communicate with a non-technical CEO?","Outcome · Options · Decision","I translate architecture choices into business impact. For example, with MedIQ reporting, the issue was not simply a server design: very large supplier reports affected smaller operational reports. I recommended separating heavy reporting workloads, explaining the expected service benefit and infrastructure trade-off. I then led the decision through delivery.","STAR: Problem: 2000-page reports. Decision: dedicated reporting servers. Business benefit: workload isolation. لا تخترع نسبة تحسن محددة."],["How would you secure an AI-powered analytics platform?","Access · Validation · Audit","We have practical natural-language-to-SQL reporting over MedIQ data using DeepSeek. The design uses SELECT-only execution, approved data scope, SQL validation and role-based access control. For a client, I would also assess logging, sensitive data exposure and human oversight. I focus on controlled access rather than giving a language model unrestricted database permissions.","NL-to-SQL تطبيق عملي وليس مجرد PoC. لا تدّعِ Deep AI research أو LLMOps تخصص عميق."],["What would you do if a client demands a big-bang migration?","Risk · Alternatives · Evidence","I would explain operational risks and compare a big-bang cutover with phased migration. I would recommend pilots, parallel runs and rollback plans where practical.","لا ترفض دون تحليل؛ استخدم BIA وDependency Mapping وCutover Criteria."],["How do you define non-functional requirements?","Availability · Security · Performance","I define non-functional requirements with business and technical owners, then turn them into measurable acceptance criteria. On MedIQ, large supplier reports could exceed 2,000 pages. I chose dedicated reporting servers to isolate heavy workloads from short entity reports. That is a practical example of translating performance needs into architecture decisions.","أفضل مثال NFR حقيقي هو Reporting Isolation. RTO/RPO لا تذكر أرقامًا غير مؤكدة."],["What if your recommendation conflicts with a vendor's proposal?","Evidence · Independence · Decision","I assess both options against agreed requirements, total cost, security, integration and vendor lock-in, then present a transparent recommendation.","الاستشاري مستقل، لكن يحترم القيود التجارية والتعاقدية للعميل."],["How do you ensure roadmap execution?","Ownership · Gates · Metrics","I combine architecture governance with delivery accountability. At UPA, I lead 54 professionals through nine managers, oversee an annual technology budget of around EGP 150 million, and use review gates, change controls and delivery metrics. I focus on business outcomes, risk and accountable ownership rather than treating a roadmap as only a diagram.","54 team, 9 reports, budget 150M. CAB, QA/UAT, DORA-aligned metrics with appropriate scope."],["What questions would you ask EY's Director?","Clients · Challenges · Success","What are the main architecture challenges facing your MENA clients, and what would success look like for this role in the first six months?","سؤال ختامي قوي يركز على قيمة الدور وتوقعات العميل."]];let current=0;let previousFocus=null;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{let b=document.createElement('button');b.className='q';b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>';let s=document.createElement('span');s.textContent=x[0];b.appendChild(s);b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;let x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('answer').textContent=x[2];document.getElementById('arabic').textContent=x[3];previousFocus=document.activeElement;overlay.classList.add('show');document.querySelector('.close').focus()}function closeQ(){overlay.classList.remove('show');if(previousFocus)previousFocus.focus()}overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1)}</script></body></html>
