<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EY | Director Interview Focus · Updated</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253b;font-family:Arial,sans-serif}header{background:#17253b;color:white;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}small{color:#d8e1ef}main{max-width:1250px;margin:auto;padding:14px}.top{font-size:12px;color:#64748b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.q{background:white;border:1px solid #dce3ec;border-left:4px solid #f4c400;border-radius:10px;min-height:80px;padding:12px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.35;color:#17253b}.q:hover{background:#fff9dc}.n{color:#8995a8;font-size:11px;margin-right:8px}.overlay{position:fixed;inset:0;background:#101d31b8;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modal h2{font-size:22px}.keys{display:inline-block;background:#fff3bc;border-radius:8px;padding:9px;font-weight:bold}.answer{font-size:17px;line-height:1.6}.arabic{direction:rtl;text-align:right;background:#f2f6fc;padding:15px;border-radius:10px;line-height:1.8}.actions{display:flex;justify-content:space-between;margin-top:18px}button.action{background:#17253b;color:white;border:0;border-radius:8px;padding:10px 15px}.q:focus-visible,.close:focus-visible,.action:focus-visible{outline:3px solid #2563eb;outline-offset:2px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;font-size:22px;padding:4px 12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.q{font-size:12px;min-height:86px;padding:10px}header h1{font-size:16px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div><h1>EY · Enterprise Architecture</h1><small>Director Technical Interview | Focus Study</small></div><small>11 Nov · 3 PM Cairo</small></header><main><div class="top">39 rigorously reviewed questions · Real examples + consulting scenarios · EN + AR</div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" onclick="closeQ()">×</button><small id="count"></small><h2 id="question"></h2><div class="keys" id="keys"></div><p class="answer" id="answer"></p><div class="arabic" id="arabic"></div><div class="actions"><button class="action" onclick="openQ(current-1)">← Previous</button><button class="action" onclick="openQ(current+1)">Next →</button></div></div></div><script>const data=[["Tell me about yourself and your architecture experience","Strategy · Architecture · Delivery","I have over 18 years of experience, from hands-on software engineering to enterprise technology leadership. Today I head Information Systems and Digital Transformation at UPA, leading 54 professionals through nine direct reports and overseeing an annual technology budget of around EGP 150 million. I have led architecture decisions for MedIQ, a national healthcare platform, including integration, data and reporting architecture. Earlier in Oman, I led 20 developers on government and enterprise systems, including an education portal serving around one million users. I bring practical architecture ownership, delivery experience and public-sector understanding.","ابدأ Career Journey ثم UPA 54/9 و150M، ثم MedIQ، ثم Oman. لا تطل أكثر من 75 ثانية."],["Walk me through MedIQ architecture and your contribution","Business · Integration · Outcomes","MedIQ is a national healthcare procurement and supply-chain platform serving over 38,000 users. I owned major architecture and technology decisions, while my engineering teams implemented them. I selected React with KendoReact, Node.js, PostgreSQL, Redis and Telerik Reporting. We used a layered architecture with a central transaction database and separated workloads where needed. For example, I decided to move very large supplier reports onto dedicated servers because reports exceeding 2,000 pages were affecting smaller reports. This improved workload isolation. The wider transformation reduced order cycle time by 80% and delivery cycle time by 60%.","أهم قصة شخصية: اخترت Stack، وحددت فصل التقارير الثقيلة. وضح PostgreSQL transaction core، Redis cache، Docker، Superset. النتائج تخص التحول ككل، لا تنسب كل رقم لقرار واحد."],["How would you establish Enterprise Architecture for a government client?","Strategy · Capabilities · Roadmap","I would begin with the client's strategy, legal obligations and key services. At UPA, I have worked across procurement, inventory, pharmacy, assets and reporting, so I know why capability mapping matters. I would document the current applications and data flows, identify risks, then agree a target architecture and phased roadmap with accountable owners.","الخبرة الواقعية: UPA Portfolio متعدد المجالات. تأسيس EA لعميل جديد هنا منهج مقترح، وليس مشروعًا تدّعي تنفيذه بنفس الاسم."],["Explain TOGAF ADM and how you apply it","ADM · Governance · Migration","TOGAF ADM gives a structured and iterative way to develop architecture: vision, business, data, applications, technology, opportunities, migration and governance. In my UPA work, I apply similar practices through architecture decisions, integration design, QA/UAT gates and change governance. I do not hold TOGAF certification.","ميّز بين تطبيق ممارسات متوافقة مع TOGAF وبين تنفيذ TOGAF ADM رسمي كامل أو الحصول على الشهادة."],["What architecture artifacts would you deliver?","Maps · Decisions · Roadmap","For a government client, I would produce a business capability map, current and target views, application and data flow maps, integration catalogue, risk and gap assessment, architecture decisions and a transition roadmap. At UPA, I have overseen cross-system integration and data governance, so I would make each artefact actionable for delivery teams.","لا تدّعِ أن كل artefact أُنتج رسميًا في UPA. الإجابة تسرد مخرجات استشارية تقترح تقديمها."],["How do you translate strategy into architecture?","Goals · Capabilities · Design","At UPA, the business objective was to improve national healthcare procurement and supply-chain processes. We translated that into digital workflows, enterprise integration, reporting and governed data capabilities. I linked architecture choices to operational results, including an 80% reduction in order cycle time across the transformation.","اربط Business Objective ثم Capabilities ثم Architecture Decisions ثم Outcomes."],["How do you establish an Architecture Review Board?","Principles · Reviews · Exceptions","I define architecture principles, decision rights, design reviews, exception handling and evidence-based approval gates. In my current leadership role, I use architecture governance alongside QA, UAT and change governance. I distinguish architecture approval from CAB decisions about production change readiness.","لديك CAB عملي وQA/UAT Gates. لا تدّعِ مجلس ARB رسمي قائم إلا إذا كان مثبتًا."],["What do you know about NORA and Saudi DGA?","NORA · DGA · Alignment","NORA is Saudi Arabia's National Overall Reference Architecture, used as a reference for government architecture alignment. I would verify the client's current DGA obligations, map business and technology capabilities, identify gaps and build a compliant roadmap. My relevant experience is large-scale government architecture in Egypt and Oman, not a claimed NORA implementation.","لا تنسب لنفسك تطبيق NORA سابقًا؛ اربط خبرة القطاع الحكومي في مصر وعمان بالسياق السعودي."],["How would you integrate SAP with government systems?","Contracts · Security · Reliability","At UPA, I led our side of a two-way integration with the SAP Strategic Medical Warehouses platform. We aligned business requirements, mapped data, defined interface contracts, tested scenarios and reconciled records before go-live. I was accountable for the UPA integration work; I did not configure SAP itself. This experience taught me to prioritise data ownership, traceability and end-to-end business validation.","استخدم SAP Strategic Medical Warehouses تحديدًا. لا تدعِ أنك SAP configurator. اذكر Reconciliation وBusiness Acceptance."],["How do you establish Data Governance and MDM?","Owners · Quality · Master Data","I led UPA-side data readiness and governance for a Central Data Warehouse that is operating in production. Our internal team handled significant data cleaning, mapping, preparation and harmonisation, alongside a delivery vendor. I focus on identifying authoritative sources, agreeing data ownership, validating quality and reconciling information before executives use it.","افصل بين Central DWH production وبين MedIQ Data Pipeline. العمل كان Hybrid مع Vendor. لا تدعِ تطبيق MDM مؤسسي كامل دون دليل."],["How do you handle disagreement with a senior stakeholder?","Listen · Trade-offs · Decide","I first understand the business concern, then compare options using risk, cost, continuity and measurable impact. During critical platform changes, I work with business owners and engineering leads to agree testing, reconciliation and cutover readiness. I document decisions and escalate unresolved risks through governance.","لا تختلق خلافًا بعينه؛ استخدم منهجك الحقيقي في Cutover Governance."],["A CIO needs a target architecture in six weeks. What do you do?","Scope · Evidence · Roadmap","I would agree scope and executive outcomes in week one, interview owners and validate the application and data landscape in weeks two and three, design options and target views in weeks four and five, then deliver a prioritised roadmap with risks and decisions in week six. I would clearly mark assumptions and unverified findings.","خطة تنفيذ استشارية افتراضية، وليست إنجازًا سابقًا."],["Why EY and why Technology Consulting?","Clients · Architecture · Impact","EY appeals to me because I want to apply my experience in government digital transformation to different organisations and complex architecture challenges. I have worked both as an engineer and as a technology leader. I can connect executive priorities to practical architecture, delivery governance and measurable business results.","لماذا EY: الانتقال من قيادة مؤسسة واحدة إلى تقديم قيمة لعملاء متعددين، دون ادعاء معرفة داخلية غير مؤكدة."],["How do you make an Architecture Decision Record?","Problem · Trade-offs · Decision","I would record the business problem, constraints, considered options, trade-offs, chosen decision and consequences. For example, at MedIQ I decided to separate heavy supplier reporting from short entity reporting because some reports exceeded 2,000 pages. That is the kind of decision I would capture in an ADR, including its rationale and operating impact.","قرار فصل التقارير مثبت؛ لا تقل إن ADR رسمي كُتب له إن لم يكن ذلك مؤكدًا."],["How do you model architecture with ArchiMate?","Layers · Dependencies · Views","ArchiMate is a modelling language for linking business, application and technology views. My strength is practical architecture ownership and explaining cross-system dependencies, such as procurement workflows, SAP integration and the data warehouse. I can work with architecture modelling standards, but I would not claim expert ArchiMate tool experience.","خبرة معمارية عملية وليست شهادة أو احتراف ArchiMate غير مثبت."],["How do you apply Security by Design and Zero Trust?","Identity · RBAC · Audit","In MedIQ, we introduced one-time-password multi-factor authentication and user activity logging. I also use role-based access and validation in our natural-language-to-SQL reporting. For a new enterprise architecture, I would extend those principles with least privilege, data classification, encryption, segmentation and continuous verification according to risk.","المنفذ: OTP MFA وactivity logging وRBAC/SQL validation. Zero Trust الكامل منهج مقترح، وليس إنجازًا مثبتًا."],["Microservices or modular monolith?","Boundaries · Consistency · Complexity","I do not choose microservices just because they are popular. For MedIQ, we kept a central transactional core to protect consistency and separated workloads where there was a clear reason, such as reporting. I would choose independently deployed services only where business boundaries, scaling and team ownership justify the extra operational complexity.","مثال MedIQ: layered architecture وtransaction core، وليس ادعاء أن النظام microservices بالكامل."],["How do you modernize a legacy system?","Assess · Strangler · Migrate","In critical public-sector platforms, I prefer controlled migration based on dependencies and data integrity. During MedIQ core replacement, I led governance around mapping, reconciliation, testing, parallel operation and cutover planning. The key trade-off was delivery speed versus continuity of service.","MedIQ core replacement هو المثال. لا تدّعِ استخدام Strangler Pattern حرفيًا ما لم يكن مثبتًا."],["How do you choose cloud, hybrid, or on-premises?","Workload · Security · Cost","At UPA, I have worked with private-cloud infrastructure, Docker-based services, load balancing and capacity planning. I assess workload sensitivity, regulation, integration, availability, operational skills and total cost before recommending cloud, hybrid or on-premises. I would not assume public cloud is always the best option.","خبرتك Private Cloud وFinOps-aligned optimisation؛ لا تدّعِ Public Cloud FinOps واسع."],["How do you design for high availability and DR?","SLA · RTO/RPO · Test","I start with business impact and recovery requirements, then review redundancy, backups, dependencies and recovery testing. At UPA, we completed a planned MedIQ recovery exercise in an alternate environment. I distinguish a tested exercise from a guaranteed recovery target and would validate RTO and RPO with measured evidence.","تمرين Recovery فعلي، لكن لا تحول الأهداف المقترحة إلى SLA محقق."],["What if a client cannot provide reliable architecture data?","Evidence · Assumptions · Validate","I would not design a target architecture from guesses. I would interview system owners, inspect available interfaces and reports, record assumptions and test the highest-risk dependencies. My UPA data warehouse work involved data cleaning, mapping and reconciliation, which taught me that unreliable source data can undermine a technically sound design.","اربط Data Cleaning/Mapping الواقعية بعملية Discovery الاستشارية."],["How do you resolve architecture versus delivery pressure?","Risk · Gates · Decision","I would show the business owner the delivery options and the risks of each. At UPA, platform changes required QA, UAT, reconciliation and change governance. If a shortcut threatened data integrity or critical security, I would recommend a controlled release or reduced scope, document the decision and escalate through the right authority.","استند إلى QA/UAT وCAB. لا تخترع حادثة ضغط محددة."],["How would you assess architecture maturity?","Governance · Baseline · Improve","I would assess architecture governance, decision rights, application landscape, data ownership, security controls and delivery practices. My UPA experience gives me practical examples across enterprise integration, change governance and a production data warehouse. I would score maturity against an agreed model and prioritise improvements with business owners.","تقييم النضج منهج استشاري؛ لا تدّعِ شهادة maturity assessment أو درجات فعلية."],["What would you deliver in your first 90 days?","Learn · Contribute · Deliver","In the first month, I would learn EY's delivery approach and understand client priorities. In the second, I would contribute to architecture assessments, stakeholder workshops and target-state options. By day ninety, I would aim to own clear deliverables and help translate architecture recommendations into an executable roadmap.","هذه خطة أول 90 يوم في EY وليست خبرة سابقة."],["How do you perform application portfolio rationalisation?","Portfolio · Value · Dependencies","At UPA, I have led a broad technology portfolio covering procurement, inventory, pharmacy, medical assets and reporting. For rationalisation, I would map each application to business capabilities, assess cost, risk and dependencies, then recommend where to retain, modernise, consolidate or retire. I would not retire systems before confirming data and integration impacts.","خبرة Portfolio حقيقية؛ تصنيف TIME يمكن عرضه كمنهج لا كتطبيق رسمي مثبت."],["How do you define architecture principles?","Outcomes · Principles · Exceptions","I start with business outcomes, then define practical principles such as data ownership, security by design, interoperability and justified reuse. In MedIQ, keeping a unified transaction core while separating heavy reporting workloads shows how consistency and performance can shape architecture decisions. I would document exceptions and accountable owners.","اربط المبادئ بقرارات MedIQ الواقعية، دون الادعاء بوجود وثيقة مبادئ رسمية غير مؤكدة."],["How do you manage technical debt?","Risk · Impact · Remediation","I prioritise technical debt by its effect on security, reliability, delivery speed and cost. At MedIQ, large supplier reports created a workload-isolation problem, so I chose dedicated reporting servers instead of treating it as a cosmetic issue. I would maintain a risk-based remediation backlog and review it alongside delivery commitments.","فصل التقارير مثال لقرار معماري يعالج bottleneck، وليس بالضرورة technical debt مسجل رسميًا."],["What is the difference between EA and Solution Architecture?","Enterprise · Solution · Alignment","Enterprise Architecture aligns business capabilities, applications, data and technology across the organisation. Solution Architecture designs a particular solution within those standards. At UPA, I work at both levels: coordinating a broad digital portfolio while owning decisions such as the MedIQ technology stack and reporting architecture.","ميزة قوية: قيادة Portfolio على مستوى المؤسسة وقرارات Solution محددة."],["How do you handle architecture exceptions?","Risk · Owner · Expiry","I would document the exception, its business reason, risk, compensating controls, owner, approval and review date. My practical background includes QA/UAT gates and CAB-based change governance at UPA. I would use that discipline to ensure architecture exceptions are visible rather than becoming permanent undocumented shortcuts.","CAB مثبت؛ سجل Architecture Exceptions رسمي ليس مثبتًا."],["How do you make a business case for modernisation?","TCO · Outcomes · Risk","I would compare investment, operating cost, delivery risk, business benefit and the cost of doing nothing. In MedIQ, modernisation was linked to measurable outcomes, including an 80% reduction in order cycle time and 60% in delivery cycle time across the transformation. I would validate baselines before calculating ROI or TCO for a client.","لا تنسب نسب التحسن إلى component واحد، ولا تخترع ROI مالي."],["How do you design an API governance model?","Standards · Security · Lifecycle","I have personally designed healthcare REST APIs using JSON, HTTPS and token-based access, and I have also led larger integration teams. I start with the business process and data owner, then define contracts, validation, error handling, security, logging and testing. At enterprise scale, I add versioning and governance across systems.","ميز Hands-on REST APIs عن قيادة SAP Integration. لا تدّعِ Kafka production أو ESB غير مثبت."],["What is the difference between ARB and CAB?","Design · Change · Readiness","An Architecture Review Board focuses on design alignment, principles and exceptions. A Change Advisory Board focuses on the operational risk and readiness of production changes. I have practical CAB and release-governance experience at UPA. I would connect the two so approved designs are also safely implemented.","خبرة CAB مؤكدة؛ لا تدّعِ قيادة ARB رسمي إن لم يثبت."],["How do you communicate with a non-technical CEO?","Outcome · Options · Decision","I translate architecture choices into business impact. For example, with MedIQ reporting, the issue was not simply a server design: very large supplier reports affected smaller operational reports. I recommended separating heavy reporting workloads, explaining the expected service benefit and infrastructure trade-off. I then led the decision through delivery.","STAR: Problem: 2000-page reports. Decision: dedicated reporting servers. Business benefit: workload isolation. لا تخترع نسبة تحسن محددة."],["How would you secure an AI-powered analytics platform?","Access · Validation · Audit","We have practical natural-language-to-SQL reporting over MedIQ data using DeepSeek. The design uses SELECT-only execution, approved data scope, SQL validation and role-based access control. For a client, I would also assess logging, sensitive data exposure and human oversight. I focus on controlled access rather than giving a language model unrestricted database permissions.","NL-to-SQL تطبيق عملي وليس مجرد PoC. لا تدّعِ Deep AI research أو LLMOps تخصص عميق."],["What would you do if a client demands a big-bang migration?","Dependencies · Reconcile · Cutover","I would assess business deadlines, dependencies and recovery options before agreeing to a big-bang migration. In MedIQ core replacement, I led governance around data mapping, reconciliation, testing, parallel operation and cutover planning. That experience supports a phased or controlled approach where continuity and data integrity are critical.","مثال MedIQ Core Replacement موثق؛ لا تضف Strangler Pattern كتطبيق فعلي دون دليل."],["How do you define non-functional requirements?","Availability · Security · Performance","I define non-functional requirements with business and technical owners, then turn them into measurable acceptance criteria. On MedIQ, large supplier reports could exceed 2,000 pages. I chose dedicated reporting servers to isolate heavy workloads from short entity reports. That is a practical example of translating performance needs into architecture decisions.","أفضل مثال NFR حقيقي هو Reporting Isolation. RTO/RPO لا تذكر أرقامًا غير مؤكدة."],["What if your recommendation conflicts with a vendor's proposal?","Requirements · Evidence · Independence","I would compare the vendor's proposal with business requirements, security, integration, operational support and total cost. At UPA, I have led technology selection and integration governance, including decisions on the MedIQ stack and reporting components. I would present a transparent recommendation, not simply accept or reject a vendor's preferred technology.","أبرز قرارات اختيار KendoReact/Telerik والتكاملات؛ لا تختلق نزاعًا بعينه مع Vendor."],["How do you ensure roadmap execution?","Ownership · Gates · Metrics","I combine architecture governance with delivery accountability. At UPA, I lead 54 professionals through nine managers, oversee an annual technology budget of around EGP 150 million, and use review gates, change controls and delivery metrics. I focus on business outcomes, risk and accountable ownership rather than treating a roadmap as only a diagram.","54 team, 9 reports, budget 150M. CAB, QA/UAT, DORA-aligned metrics with appropriate scope."],["What questions would you ask EY's Director?","Clients · Outcomes · Success","What are the most common enterprise architecture challenges your government and large-enterprise clients face? How does the team measure the impact of its architecture recommendations? What would strong performance look like in the first six months?","اختر سؤالين فقط حسب الوقت؛ لا تسأل عن معلومات ذكرها المحاور بالفعل."]];let current=0;let previousFocus=null;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{let b=document.createElement('button');b.className='q';b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>';let s=document.createElement('span');s.textContent=x[0];b.appendChild(s);b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;let x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('answer').textContent=x[2];document.getElementById('arabic').textContent=x[3];if(!overlay.classList.contains('show'))previousFocus=document.activeElement;overlay.classList.add('show');document.querySelector('.close').focus()}function closeQ(){overlay.classList.remove('show');if(previousFocus)previousFocus.focus()}overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape'&&overlay.classList.contains('show'))closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1);if(overlay.classList.contains('show')&&e.key==='Tab'){const focusable=[...overlay.querySelectorAll('button:not([disabled])')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}</script></body></html>
