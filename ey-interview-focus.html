<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EY | Director Interview Focus · Updated</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253b;font-family:Arial,sans-serif}header{background:#17253b;color:white;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}small{color:#d8e1ef}main{max-width:1250px;margin:auto;padding:14px}.top{font-size:12px;color:#64748b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.q{background:white;border:1px solid #dce3ec;border-left:4px solid #f4c400;border-radius:10px;min-height:80px;padding:12px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.35;color:#17253b}.q:hover{background:#fff9dc}.n{color:#8995a8;font-size:11px;margin-right:8px}.overlay{position:fixed;inset:0;background:#101d31b8;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modal h2{font-size:22px}.keys{display:inline-block;background:#fff3bc;border-radius:8px;padding:9px;font-weight:bold}.answer{font-size:17px;line-height:1.6}.arabic{direction:rtl;text-align:right;background:#f2f6fc;padding:15px;border-radius:10px;line-height:1.8}.actions{display:flex;justify-content:space-between;margin-top:18px}button.action{background:#17253b;color:white;border:0;border-radius:8px;padding:10px 15px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;font-size:22px;padding:4px 12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.q{font-size:12px;min-height:86px;padding:10px}header h1{font-size:16px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div><h1>EY · Enterprise Architecture</h1><small>Director Technical Interview | Focus Study</small></div><small>11 Nov · 3 PM Cairo</small></header><main><div class="top">18 priority questions · Tap to open answer · EN + AR + Keywords</div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" onclick="closeQ()">×</button><small id="count"></small><h2 id="question"></h2><div class="keys" id="keys"></div><p class="answer" id="answer"></p><div class="arabic" id="arabic"></div><div class="actions"><button class="action" onclick="openQ(current-1)">← Previous</button><button class="action" onclick="openQ(current+1)">Next →</button></div></div></div><script>const data=[["Tell me about yourself and your architecture experience","Strategy · Architecture · Delivery","I have over 18 years of experience in enterprise technology and transformation. At UPA, I lead over 54 engineers. I focus on architecture decisions, integration, governance, and business results. MedIQ is a key example.","ابدأ بالخبرة، ثم دورك في Architecture Decision-Making، ثم قيادة 54+ مهندساً، ونتائج MedIQ. لا تكتفِ بسرد مسؤوليات الإدارة."],["How would you establish Enterprise Architecture for a government client?","Assess · Target · Roadmap","I start with business goals and stakeholders. I assess the current state, map business capabilities, define the target architecture, identify gaps, and build a phased roadmap with governance.","حدد Business Objectives ثم As-Is وCapability Map وGap Analysis وTarget State وTransition Roadmap. اربط كل مرحلة بمخرجات واضحة."],["Explain TOGAF ADM and how you apply it","Vision · Domains · Governance","TOGAF ADM starts with preparation and architecture vision. It covers business, data, application, and technology architecture, then opportunities, migration planning, implementation governance, and change management.","احفظ التسلسل: Preliminary, A Vision, B Business, C Information Systems, D Technology, E Opportunities & Solutions, F Migration Planning, G Implementation Governance, H Change Management. Requirements Management مستمر. لا تدّعِ امتلاك شهادة TOGAF."],["What architecture artifacts would you deliver?","Capabilities · Diagrams · Roadmap","I deliver a capability map, current and target architecture views, application and integration inventories, data flows, gap analysis, standards, architecture decisions, and a prioritized roadmap.","Business Capability Map، Application Portfolio، Integration Landscape، Data Flow، Target Architecture، Gap Matrix، ADRs، Roadmap. اذكر الهدف من كل Artifact."],["How do you establish an Architecture Review Board?","Principles · Reviews · Exceptions","I define the board's mandate, architecture standards, review gates, decision owners, and exception process. I document decisions and track compliance without blocking delivery unnecessarily.","وضح ARB Charter، معايير المراجعة، Decision Log، Exception Register، آلية التصعيد، وإغلاق المخاطر."],["What do you know about NORA and Saudi DGA?","Reference · Alignment · Compliance","I understand NORA as a Saudi government enterprise architecture reference. I would confirm the applicable DGA requirements, assess gaps, and map the client's architecture and roadmap to the required standards.","NORA مرجع حكومي سعودي وDGA جهة الحوكمة الرقمية. لا تزعم تنفيذ NORA عملياً؛ اشرح كيف تجري Compliance Assessment وتتحقق من أحدث الإصدارات الرسمية."],["How do you model architecture with ArchiMate?","Business · Application · Technology","ArchiMate helps communicate relationships between business processes, applications, and technology. I select views based on stakeholder questions and keep models linked to decisions.","Business Layer وApplication Layer وTechnology Layer، مع Motivation وImplementation & Migration. إذا لم تستخدم الأداة مباشرة، قل إنك تفهم المنهج وتستخدم رسومات Architecture مكافئة."],["How do you translate strategy into architecture?","Goals · Capabilities · Design","I map business objectives to capabilities, identify gaps, define architecture requirements and options, then prioritize changes based on value, risk, and cost.","Strategy-to-Capability Mapping ثم Requirements وOptions وRoadmap وKPIs. قدم مثالاً من دورة طلبات MedIQ."],["Walk me through MedIQ architecture and your contribution","Business · Integration · Outcomes","MedIQ is a national healthcare transformation platform. I led technology teams and governance across integration, data, and delivery decisions. The program reduced order cycle time by 80%.","اشرح As-Is، Architecture Decisions، تكامل SAP، Data Governance، Quality Gates، ونتائج الأعمال. ميز بوضوح بين دورك ودور المهندسين."],["How would you integrate SAP with government systems?","Contracts · Security · Reliability","I define data ownership and interface contracts, choose suitable APIs or messaging, and address authentication, retries, idempotency, monitoring, and reconciliation.","REST/SOAP وMapping وVersioning وError Handling وIdempotency وReconciliation. استخدم تكامل SAP ثنائي الاتجاه مثالاً حقيقياً."],["Microservices or modular monolith?","Domain · Scale · Complexity","I choose based on business domains, team structure, scaling needs, and operational complexity. I do not use microservices by default. A modular monolith may be safer and simpler.","ناقش Bounded Contexts وDeployment Independence وDistributed Transactions وObservability وOperational Cost."],["How do you modernize a legacy system?","Assess · Strangler · Migrate","I map dependencies and risks, prioritize high-value capabilities, expose stable interfaces, and migrate incrementally with testing, rollback, and business continuity.","Strangler Pattern وParallel Run وTransition Architecture وRollback. تجنب Big-Bang ما لم يكن مبرراً."],["How do you choose cloud, hybrid, or on-premises?","Workload · Security · Cost","I assess data sensitivity, regulations, integration, availability, latency, skills, and total cost. Then I recommend the architecture that best fits business needs.","Data Residency وTCO وSecurity وRTO/RPO وVendor Lock-in. لا تدّعِ خبرة Hands-on غير مثبتة."],["How do you design for high availability and DR?","SLA · RTO/RPO · Test","I agree on service targets, identify failure points, design redundancy and recovery, and validate the solution with monitoring, failover tests, and disaster recovery exercises.","ابدأ بـBusiness Impact Analysis ثم SLA وRTO/RPO، وحدد Recovery Architecture واختبارات DR."],["A CIO needs a target architecture in six weeks. What do you do?","Scope · Workshops · Roadmap","I agree on scope and deliverables, run stakeholder workshops, assess the current state, develop target options, and deliver a practical roadmap with risks and assumptions.","Consulting Engagement: Kickoff، Interviews، Evidence Collection، Baseline، Options، Target State، Executive Readout."],["How do you handle disagreement with a senior stakeholder?","Listen · Trade-offs · Decide","I understand the concern, present clear options with cost, risk, and business impact, and document the agreed decision and ownership.","اعرض Decision Matrix بلغة Business، وليس دفاعاً عن تكنولوجيا بعينها. اربطها بمثال واقعي."],["Why EY and why Technology Consulting?","Clients · Impact · Growth","I want to use my enterprise transformation experience across different clients. EY offers an opportunity to combine architecture, advisory, and measurable business outcomes.","الانتقال من قيادة Transformation داخل جهة واحدة إلى Advisory لعملاء MENA. لا تركز على الراتب أو ترك الوظيفة الحالية."],["What would you deliver in your first 90 days?","Understand · Assess · Deliver","I would learn EY's delivery standards and client priorities, support architecture assessments, build stakeholder trust, and deliver actionable recommendations and roadmaps.","30 يوم فهم Context، 60 يوم Assessment، 90 يوم Deliverables. ركز على Client Value."]];let current=0;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{let b=document.createElement('button');b.className='q';b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>';let s=document.createElement('span');s.textContent=x[0];b.appendChild(s);b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;let x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('answer').textContent=x[2];document.getElementById('arabic').textContent=x[3];overlay.classList.add('show')}function closeQ(){overlay.classList.remove('show')}overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape')closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1)}</script></body></html>
