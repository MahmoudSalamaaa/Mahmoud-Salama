<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EY | Director Interview Focus</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17253b;font-family:Arial,sans-serif}header{background:#17253b;color:white;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:19px;margin:0}small{color:#d8e1ef}main{max-width:1250px;margin:auto;padding:14px}.top{font-size:12px;color:#64748b;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.q{background:white;border:1px solid #dce3ec;border-left:4px solid #f4c400;border-radius:10px;min-height:80px;padding:12px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.35;color:#17253b}.q:hover{background:#fff9dc}.n{color:#8995a8;font-size:11px;margin-right:8px}.overlay{position:fixed;inset:0;background:#101d31b8;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.modal{background:white;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modal h2{font-size:22px}.keys{display:inline-block;background:#fff3bc;border-radius:8px;padding:9px;font-weight:bold}.answer{font-size:17px;line-height:1.6}.arabic{direction:rtl;text-align:right;background:#f2f6fc;padding:15px;border-radius:10px;line-height:1.8}.actions{display:flex;justify-content:space-between;margin-top:18px}button.action{background:#17253b;color:white;border:0;border-radius:8px;padding:10px 15px}.close{float:right;border:0;background:#eef2f7;border-radius:8px;font-size:22px;padding:4px 12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.q{font-size:12px;min-height:86px;padding:10px}header h1{font-size:16px}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><div><h1>EY · Enterprise Architecture</h1><small>Director Technical Interview | Focus Study</small></div><small>11 Nov · 3 PM Cairo</small></header><main><div class="top">12 priority questions · Tap to open answer · EN + AR + Keywords</div><div class="grid" id="grid"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><button class="close" onclick="closeQ()">×</button><small id="count"></small><h2 id="question"></h2><div class="keys" id="keys"></div><p class="answer" id="answer"></p><div class="arabic" id="arabic"></div><div class="actions"><button class="action" onclick="openQ(current-1)">← Previous</button><button class="action" onclick="openQ(current+1)">Next →</button></div></div></div><script>const data=[["Tell me about yourself","Strategy · Architecture · Delivery","I have over 18 years of technology and digital transformation experience. At UPA, I lead more than 54 engineers and oversee enterprise systems, integration and governance. MedIQ is a major transformation example.","ابدأ بخبرتك القيادية، ثم Enterprise Architecture، ثم MedIQ."],["How do you approach Enterprise Architecture?","Assess · Target · Roadmap","I understand business goals, assess the current architecture, define a target state, identify gaps, and create a phased roadmap with governance and measurable outcomes.","Business Capabilities ثم As-Is ثم Target Architecture ثم Gap Analysis ثم Roadmap."],["Describe your strongest transformation project","MedIQ · Integration · Results","At UPA, I led teams and delivery governance for MedIQ. We improved workflows, integrated enterprise systems, strengthened data governance, and reduced order cycle time by 80%.","احكِ المشكلة، قرارات Architecture، التكامل، الحوكمة، والنتائج."],["How do you govern architecture decisions?","Standards · Reviews · Exceptions","I define architecture principles, review designs, assess risks, document decisions, and manage exceptions while aligning security and delivery priorities.","Architecture Reviews وDecision Records وCAB وRelease Readiness."],["How do you integrate legacy systems?","APIs · Contracts · Reliability","I assess constraints and choose APIs, middleware, or messaging based on requirements. I define contracts, access controls, monitoring, retries, and data consistency. SAP integration is one example.","REST/SOAP وVersioning وTimeout وRetry وIdempotency، مع مثال SAP."],["How would you modernize a monolith?","Prioritize · Strangler · Migrate","I map dependencies and business risks, then modernize incrementally where suitable, using APIs and phased migration instead of unnecessary big-bang replacement.","Strangler Pattern وParallel Run وRollback؛ ليس كل Monolith يحتاج Microservices."],["How do you choose Cloud vs On-Prem?","Workload · Security · Cost","I compare data sensitivity, regulations, performance, integration, resilience, and total cost. I select cloud, on-premises, or hybrid according to business requirements.","Cloud/Hybrid Decision Matrix وData Residency وTCO وBC/DR."],["How do you handle stakeholder conflict?","Listen · Options · Decide","I clarify priorities, present options and trade-offs in cost, risk and delivery, and agree on a decision with accountable stakeholders.","استخدم مثالاً من UPA عن اختلاف أولويات Business وIT."],["How would you work as an EY consultant?","Discover · Advise · Deliver","I run structured discovery, translate business needs into architecture options, present clear recommendations, and support practical roadmaps with measurable value.","Client Workshops وAssessments وRecommendations وExecutive Communication."],["Why EY?","Clients · Impact · Growth","EY offers opportunities to solve complex technology challenges for different clients. I want to apply my architecture and transformation experience to deliver measurable business outcomes.","اربط خبرتك بالانتقال إلى Technology Consulting وخدمة عملاء متنوعين."],["How do you measure architecture success?","Value · Reliability · Risk","I measure business KPIs and technical outcomes including cycle time, reliability, integration quality, security, cost, and adoption.","استخدم مثال MedIQ: تقليل Order Cycle Time بنسبة 80%."],["What are your first 90 days?","Understand · Assess · Deliver","I learn EY standards and client priorities, contribute to architecture assessments and stakeholder workshops, and deliver actionable recommendations.","30 يوم فهم، 60 يوم Assessments، 90 يوم Deliverables."]];let current=0;const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');data.forEach((x,i)=>{let b=document.createElement('button');b.className='q';b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span>';let s=document.createElement('span');s.textContent=x[0];b.appendChild(s);b.onclick=()=>openQ(i);grid.appendChild(b)});function openQ(i){current=(i+data.length)%data.length;let x=data[current];document.getElementById('count').textContent='QUESTION '+(current+1)+' / '+data.length;document.getElementById('question').textContent=x[0];document.getElementById('keys').textContent=x[1];document.getElementById('answer').textContent=x[2];document.getElementById('arabic').textContent=x[3];overlay.classList.add('show')}function closeQ(){overlay.classList.remove('show')}overlay.onclick=e=>{if(e.target===overlay)closeQ()};document.onkeydown=e=>{if(e.key==='Escape')closeQ();if(overlay.classList.contains('show')&&e.key==='ArrowRight')openQ(current+1);if(overlay.classList.contains('show')&&e.key==='ArrowLeft')openQ(current-1)}</script></body></html>
