<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="View or download Mahmoud Salama's executive technology and digital transformation CV.">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0f2942">
  <link rel="canonical" href="https://mahmoud-salama.vercel.app/resume.html">
  <link rel="icon" href="assets/images/favicon.ico">
  <title>Executive CV | Mahmoud Salama</title>
  <style>
    :root{--navy:#0f2942;--navy2:#071727;--cyan:#00afc8;--gold:#c99a32;--paper:#f4f7fa;--text:#152536}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--text)}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px clamp(18px,4vw,54px);background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;box-shadow:0 6px 22px rgba(3,18,31,.18)}
    .identity{display:flex;align-items:center;gap:14px}.identity img{width:48px;height:48px;object-fit:contain}.identity strong{display:block;font-size:19px}.identity span{display:block;margin-top:3px;color:#bcd4e5;font-size:13px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 16px;border:1px solid rgba(255,255,255,.25);border-radius:999px;color:#fff;text-decoration:none;font-weight:700}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#051c28}.btn:hover{transform:translateY(-1px)}
    main{padding:18px clamp(10px,2vw,24px) 28px}.viewer{width:min(1120px,100%);height:calc(100vh - 118px);min-height:650px;margin:auto;border:1px solid #cbd7e0;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 16px 45px rgba(17,42,65,.14)}
    iframe{width:100%;height:100%;border:0;background:#fff}.fallback{padding:30px;text-align:center}.fallback a{color:var(--navy);font-weight:700}
    @media(max-width:700px){header{align-items:flex-start;flex-direction:column}.viewer{height:calc(100vh - 190px);min-height:520px}.identity strong{font-size:17px}}
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <header>
    <div class="identity">
      <img src="assets/images/logo.png" alt="Mahmoud Salama logo">
      <div><strong>Mahmoud Salama</strong><span>Technology &amp; Digital Transformation Executive | Enterprise Architect</span></div>
    </div>
    <nav class="actions" aria-label="Resume actions">
      <a class="btn" href="index.html">Back to Portfolio</a>
      <a class="btn primary" href="assets/documents/Mahmoud_Salama_Executive_CV_2026.pdf" download="Mahmoud_Salama_Executive_CV_2026.pdf">Download PDF</a>
    </nav>
  </header>
  <main>
    <div class="viewer">
      <iframe title="Mahmoud Salama Executive CV" src="assets/documents/Mahmoud_Salama_Executive_CV_2026.pdf#view=FitH">
        <div class="fallback">Your browser cannot display PDFs. <a href="assets/documents/Mahmoud_Salama_Executive_CV_2026.pdf">Download the CV</a>.</div>
      </iframe>
    </div>
  </main>
</body>
</html>
